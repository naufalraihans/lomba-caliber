<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>CALIBER — Intelligent Manufacturing Operations Center · Case 2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--sb:#0A2342;--bg:#F3F5F9;--card:#fff;--line:#E5E7EB;--ink:#111928;--mut:#6B7280;
--blue:#1A56DB;--sky:#3B82F6;--green:#16A34A;--amber:#D97706;--amberBg:#FEF3C7;--red:#DC2626;--redBg:#FEE2E2;--greenBg:#DCFCE7}
body{background:var(--bg);color:var(--ink);font:12.5px/1.5 "Plus Jakarta Sans",Inter,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:196px 1fr;min-height:100vh}
.sb{background:var(--sb);color:#C9D5E8;padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:9px;padding:2px 8px 4px;color:#fff;font-weight:800;font-size:11px;letter-spacing:.3px}
.logo i{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#53c3d9,#1A56DB);display:grid;place-items:center;font-style:normal;font-size:13px;color:#fff;flex:none}
.logo small{display:block;font-size:9px;color:#7E8FAD;font-weight:600;letter-spacing:.4px}
.mi{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:12px;font-weight:600;color:#C9D5E8;cursor:pointer;border:0;background:none;width:100%;text-align:left;font-family:inherit}
.mi .ic{width:18px;text-align:center;font-size:14px}
.mi:hover{background:rgba(255,255,255,.08);color:#fff}
.mi.on{background:#fff;color:#0A2342;font-weight:700}
.mi .bdg{margin-left:auto;background:#DC2626;color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 7px}
.sbsep{border-top:1px solid rgba(255,255,255,.12);margin:10px 4px}
.sbh{font-size:10px;letter-spacing:1px;color:#7E8FAD;padding:6px 12px 2px;font-weight:700}
.main{min-width:0;padding:0 20px 46px}
.top{position:sticky;top:0;z-index:20;background:rgba(243,245,249,.92);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:12px 0}
.search{flex:1;max-width:460px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 14px;color:var(--mut);font-size:12px;font-family:inherit}
.top .dt{margin-left:auto;font-size:11.5px;color:var(--mut);font-weight:600;white-space:nowrap}
.bell{width:32px;height:32px;border-radius:9px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;position:relative;font-size:15px}
.bell i{position:absolute;top:-6px;right:-6px;background:#DC2626;color:#fff;font-size:9.5px;font-weight:800;border-radius:999px;padding:1px 6px;font-style:normal}
.adm{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:4px 10px 4px 4px;font-size:12px;font-weight:700}
.adm i{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px}
.view{display:none}.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:19px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:12px;margin:2px 0 14px}
.row5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.row2{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 2px rgb(16 24 40/.05);min-width:0}
.card h3{font-size:13.5px;font-weight:700;margin-bottom:2px}
.card .cap{font-size:11px;color:var(--mut);margin-bottom:12px}
.kpi .lab{font-size:10.5px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.kpi .v{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:4px 0 0;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;font-weight:700;color:var(--mut)}
.kpi .s{font-size:11px;font-weight:600}
.g{color:var(--green)}.r{color:var(--red)}.a{color:var(--amber)}.b{color:var(--sky)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:10.5px;font-weight:700;white-space:nowrap}
.p-g{background:var(--greenBg);color:var(--green)}.p-a{background:var(--amberBg);color:var(--amber)}.p-r{background:var(--redBg);color:var(--red)}.p-b{background:#DBEAFE;color:var(--blue)}.p-n{background:#F1F5F9;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);padding:7px 8px;border-bottom:1px solid var(--line);font-weight:700}
td{padding:8px;border-bottom:1px solid #F1F5F9;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#F8FAFF}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:9px 16px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--red)}
.btnrow{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.fpill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink)}
.fpill.on{background:#0A2342;color:#fff;border-color:#0A2342}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;background:#fff}
.alert .t{font-size:12px;font-weight:700}
.alert .d{font-size:11px;color:var(--mut)}
.alert .when{margin-left:auto;font-size:10.5px;font-weight:700;white-space:nowrap}
.grid-assets{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.acard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center}
.acard .aid{font-weight:800;font-size:13px}
.acard .anm{font-size:11px;color:var(--mut);margin-bottom:8px;min-height:30px}
.ring{position:relative;width:104px;height:104px;margin:0 auto 8px}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:17px}
.link{color:var(--blue);font-size:11.5px;font-weight:700;cursor:pointer;background:none;border:0;font-family:inherit;padding:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;font-family:inherit;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:7px 18px;font-size:11.5px}
.spec .k{color:var(--mut)}
.minis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.mini{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mini .l{font-size:10.5px;color:var(--mut);font-weight:600}
.mini .vv{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 14px}
.tl .ev:before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--sky);border:2px solid #fff;box-shadow:0 0 0 2px var(--sky)}
.tl .ev.done:before{background:var(--green);box-shadow:0 0 0 2px var(--green)}
.tl .ev .tt{font-size:11.5px;font-weight:700}
.tl .ev .dd{font-size:11px;color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:14px;min-height:170px;padding:10px 6px 0}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bar i{width:70%;border-radius:5px 5px 0 0;display:block}
.bar span{font-size:10px;color:var(--mut);font-weight:600}
.rep{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #F1F5F9}
.rep:last-child{border-bottom:0}
.rep .doc{width:34px;height:34px;border-radius:9px;background:#DBEAFE;color:var(--blue);display:grid;place-items:center;font-size:16px;flex:none}
.rep .t{font-size:12.5px;font-weight:700}
.rep .d{font-size:11px;color:var(--mut)}
.rep .btn{margin-left:auto}
.fld{margin-bottom:12px}.fld label{font-size:11.5px;font-weight:700;display:block;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-family:inherit;font-size:12.5px;background:#fff;color:var(--ink)}
.fld textarea{min-height:74px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:11.5px;color:var(--mut)}
.pager button{border:1px solid var(--line);background:#fff;border-radius:7px;min-width:28px;height:28px;cursor:pointer;font-family:inherit;font-size:11.5px}
.pager button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.note{background:#EFF6FF;border:1px solid #BFDBFE;border-radius:10px;padding:10px 13px;font-size:11.5px;color:#1E40AF;margin-top:12px}
.note.warn{background:#FFFBEB;border-color:#FDE68A;color:#92400E}
.prog{height:7px;background:#EDF1F7;border-radius:4px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;border-radius:4px;background:var(--sky)}
input[type=range]{width:130px;accent-color:var(--blue)}
select.mini-sel{border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-family:inherit;font-size:11px;background:#fff}
#modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(10,35,66,.5);z-index:50;padding:18px}
#modal.on{display:grid}
.mbox{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:22px}
.mbox h2{font-size:16px;font-weight:800;margin-bottom:2px}
.mbox .msub{font-size:11.5px;color:var(--mut);margin-bottom:14px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:99}
.tst{background:#0A2342;color:#fff;border-radius:10px;padding:10px 18px;font-size:12px;font-weight:600;box-shadow:0 10px 30px -8px rgb(0 0 0/.4)}
.pcard{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;background:#fff}
.pcard .av{width:38px;height:38px;border-radius:50%;background:#DBEAFE;color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.pcard input[type=tel]{border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-family:inherit;font-size:11.5px;width:150px}
.log{font-size:11px;border:1px solid var(--line);border-radius:9px;padding:8px 11px;margin-bottom:7px;background:#F8FAFF}
@media print{.sb,.top,#toast,#modal,.noprint{display:none!important}.app{display:block}.main{padding:0}}
@media(max-width:1100px){.app{grid-template-columns:1fr}.sb{display:none}.row5,.row4{grid-template-columns:1fr 1fr}.row3,.row2,.grid-assets,.minis{grid-template-columns:1fr}.f2{grid-template-columns:1fr}}
</style>
</head>

<div class="btnrow"><button class="btn" onclick="saveFol(${serial||"null"})">Save follow-up</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);}
function saveFol(serial){const E=eff();const r=serial?E.find(x=>x.serial===serial):E[0];
const g=id=>document.getElementById(id).value;
follows.unshift({id:"F-"+(Date.now()%100000),serial:r.serial,tag:r.tag,title:String(r.title).slice(0,48),action:g("f-act"),pic:g("f-pic"),due:g("f-due"),status:g("f-st"),prog:+g("f-pr")||0,note:g("f-no"),created:String(TODAY).slice(0,10)});
saveAll();closeModal();toast("Follow-up saved.");if(state.v!=="followup")go("followup");else render();}
function editFol(id){const f=follows.find(x=>x.id===id);if(!f)return;
modal(`<h2>Edit ${f.id}</h2><div class="msub">INC-${String(f.serial).padStart(4,"0")} · ${esc(f.tag)}</div>
<div class="fld"><label>Action</label><textarea id="f-act">${esc(f.action)}</textarea></div>
<div class="f2"><div class="fld"><label>Owner (PIC)</label><input id="f-pic" value="${esc(f.pic)}"></div><div class="fld"><label>Due date</label><input id="f-due" type="date" value="${(f.due||"").slice(0,10)}"></div></div>
<div class="f2"><div class="fld"><label>Status</label><select id="f-st">${["Open","In Progress","Done","Verified"].map(o=>`<option${o===f.status?" selected":""}>${o}</option>`).join("")}</select></div>
<div class="fld"><label>Progress %</label><input id="f-pr" type="number" min="0" max="100" value="${f.prog||0}"></div></div>
<div class="fld"><label>Note / evidence</label><input id="f-no" value="${esc(f.note||"")}"></div>
<div class="btnrow"><button class="btn" onclick="updFol('${f.id}')">Save</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);}
function updFol(id){const f=follows.find(x=>x.id===id);const g=i=>document.getElementById(i).value;
f.action=g("f-act");f.pic=g("f-pic");f.due=g("f-due");f.status=g("f-st");f.prog=+g("f-pr")||0;f.note=g("f-no");
if((f.status==="Done"||f.status==="Verified")&&f.prog<100)f.prog=100;saveAll();closeModal();render();toast("Updated.");}
function delFol(id){if(!confirm("Delete "+id+"?"))return;follows=follows.filter(f=>f.id!==id);saveAll();render();}
function setFol(id,k,v){const f=follows.find(x=>x.id===id);if(!f)return;f[k]=v;if(k==="status"&&(v==="Done"||v==="Verified"))f.prog=100;if(k==="status"&&v==="Open")f.prog=0;saveAll();render();}
function genPlan(){const{E,od}=agg();const top=od.map(r=>({...r,late:lateOf(r)||0})).map(r=>({...r,score:(+r.total_loss||0)*1000*Math.max(r.late,0)})).sort((a,b)=>b.score-a.score).slice(0,10);
let n=0;for(const r of top){if(follows.some(f=>f.serial===r.serial))continue;const d=RCA[r.tag];const l=d?((d.capa||[]).concat(d.proactive||[])):[];const a=l.find(c=>!String(c.status||"").toLowerCase().includes("closed"))||l[0];
follows.push({id:"F-"+(Date.now()%100000)+"-"+n,serial:r.serial,tag:r.tag,title:String(r.title).slice(0,48),action:a?a.action:"Open the RCA record, confirm the owner, and set a due date",pic:r.pic||"-",due:r.rca_due,status:"Open",prog:0,note:"",created:"2026-08-19"});n++;}
saveAll();render();toast(n?n+" follow-ups drafted.":"Plan already exists — nothing new.");}
function planFromRca(tag){const d=RCA[tag];if(!d)return;const E=eff();const rec=E.find(r=>r.tag===tag)||E[0];let n=0;
for(const c of (d.capa||[])){if(String(c.status||"").toLowerCase().includes("closed"))continue;
follows.unshift({id:"F-"+(Date.now()%100000)+"-"+n,serial:rec.serial,tag,action:c.action,pic:c.pic||rec.pic||"-",due:rec.rca_due,status:"Open",prog:0,note:"from RCA deck",created:"2026-08-19"});n++;}
saveAll();toast(n?n+" CAPA pushed to Follow-up.":"No open CAPA on this deck.");go("followup");}
/* ---------- edit record (point 1) ---------- */
function editInc(s){const r=eff().find(x=>x.serial===s);const cur=edits[s]||{};
modal(`<h2>Edit record — INC-${String(s).padStart(4,"0")}</h2><div class="msub">${esc(String(r.title).slice(0,70))} · overrides save in this browser and recompute every figure.</div>
<div class="fld"><label>Title</label><input id="e-title" value="${esc(cur.title!==undefined?cur.title:r.title)}"></div>
<div class="f2"><div class="fld"><label>Status</label><select id="e-status">${["NEW REGISTERED","RCA PROCESS","CA/PA EXECUTION","MONITORING RESULT","RISK CLOSED","RISK CANCELED"].map(o=>`<option${(cur.status!==undefined?cur.status:r.status)===o?" selected":""}>${o}</option>`).join("")}</select></div>
<div class="fld"><label>Owner (PIC)</label><input id="e-pic" value="${esc(cur.pic!==undefined?cur.pic:(r.pic||""))}"></div></div>
<div class="f2"><div class="fld"><label>Due date</label><input id="e-due" type="date" value="${((cur.rca_due!==undefined?cur.rca_due:r.rca_due)||"").slice(0,10)}"></div>
<div class="fld"><label>Mechanism</label><input id="e-mech" value="${esc(cur.mech!==undefined?cur.mech:r.mech)}"></div></div>
<div class="f2"><div class="fld"><label>Component</label><input id="e-comp" value="${esc(cur.component!==undefined?cur.component:(r.component||""))}"></div>
<div class="fld"><label>Discipline</label><input id="e-disc" value="${esc(cur.discipline!==undefined?cur.discipline:(r.discipline||""))}"></div></div>
<div class="f2"><div class="fld"><label>Downtime (h)</label><input id="e-dt" type="number" step="0.1" value="${cur.downtime!==undefined?cur.downtime:(+r.downtime||0)}"></div>
<div class="fld"><label>Total loss (k USD)</label><input id="e-lo" type="number" step="0.01" value="${cur.total_loss!==undefined?cur.total_loss:(+r.total_loss||0)}"></div></div>
<div class="btnrow"><button class="btn" onclick="saveEdit(${s})">Save changes</button>${edits[s]?`<button class="btn ghost" onclick="delete edits[${s}];saveAll();closeModal();render();">Revert to baseline</button>`:""}<button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);}
function saveEdit(s){const g=id=>document.getElementById(id).value;
edits[s]={title:g("e-title"),status:g("e-status"),pic:g("e-pic"),rca_due:g("e-due")||null,mech:g("e-mech"),component:g("e-comp"),discipline:g("e-disc"),downtime:+g("e-dt")||0,total_loss:+g("e-lo")||0};
saveAll();closeModal();render();toast("Record updated — figures recomputed.");}
function exportCSV(){const E=eff();const rows=[["id","date","tag","title","severity","status","downtime_h","loss_usd","pic","due"]].concat(E.map(r=>["INC-"+String(r.serial).padStart(4,"0"),String(r.date).slice(0,10),r.tag,'"'+String(r.title).replace(/"/g,'""')+'"',sevOf(r),stOf(r),(+r.downtime||0),Math.round((+r.total_loss||0)*1000),r.pic||"",String(r.rca_due||"").slice(0,10)]));
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"}));a.download="caliber-incidents.csv";a.click();toast("CSV exported.");}
/* ---------- alarms + dispatch (point 5) ---------- */
function vAlarm(){const list=alarms();const pending=list.filter(a=>!sendlog.some(l=>l.key===a.key));
return `<h1>Alarms &amp; PIC Dispatch</h1><div class="sub">${list.length} active alarms · ${pending.length} awaiting dispatch · ${autoSend?'<b style="color:var(--green)">AUTO-SEND ON</b>':"auto-send off"}.</div>
<div class="card"><div class="btnrow"><button class="btn" onclick="dispatchAll()">Dispatch all pending (${pending.length})</button>
<button class="btn ghost" onclick="autoSend=!autoSend;saveAll();render();toast(autoSend?'Auto-send enabled.':'Auto-send disabled.')">${autoSend?"Disable auto-send":"Enable auto-send"}</button>
<span style="flex:1"></span><span class="sub" style="margin:0">Dispatch opens WhatsApp to the PIC number on file — or logs a simulated send.</span></div>
<table><thead><tr><th>Severity</th><th>Alarm</th><th>PIC</th><th>Detail</th><th>Dispatch</th></tr></thead><tbody>
${list.map(a=>{const sent=sendlog.find(l=>l.key===a.key);const tel=(phones[a.pic]||"").replace(/\D/g,"");
return `<tr><td><span class="pill ${a.sev==="Critical"?"p-r":"p-a"}">${a.sev}</span></td>
<td><b class="mono">${esc(a.tag)}</b> — ${esc(a.title)}</td><td class="mono">${esc(a.pic)}</td><td style="font-size:11px">${esc(a.detail)}</td>
<td style="white-space:nowrap">${sent?`<span class="pill p-g">✓ ${sent.ch}</span>`:`<button class="btn" style="padding:6px 12px" onclick="dispatchOne('${a.key}')">Send to ${esc(a.pic)}</button>`}${tel?"":' <span class="pill p-n">no number</span>'}</td></tr>`;}).join("")}</tbody></table></div>
<div class="card" style="margin-top:12px"><h3>Dispatch log (${sendlog.length})</h3><div class="cap">Every send is recorded — the audit trail for point 5</div>
${sendlog.length?sendlog.slice(0,20).map(l=>`<div class="log"><b>${esc(l.ts)}</b> → <b class="mono">${esc(l.to)}</b> via ${l.ch} · ${esc(l.msg.slice(0,110))}</div>`).join(""):'<div class="note">Nothing dispatched yet.</div>'}</div>`;}
function dispatchOne(key){const a=alarms().find(x=>x.key===key);if(!a)return;
const msg=`[CALIBER alarm] ${a.tag}: ${a.title} (${a.detail}). Please acknowledge and update the follow-up board.`;
const tel=(phones[a.pic]||"").replace(/\D/g,"");
if(tel){window.open("https://wa.me/"+tel+"?text="+encodeURIComponent(msg),"_blank");sendlog.unshift({key,ts:"2026-08-19",to:a.pic+" ("+tel+")",ch:"WhatsApp",msg});}
else{sendlog.unshift({key,ts:"2026-08-19",to:a.pic,ch:"simulated",msg});toast("No phone on file for "+a.pic+" — logged as simulated send. Add it in Personnel.");}
saveAll();render();}
function dispatchAll(){const list=alarms().filter(a=>!sendlog.some(l=>l.key===a.key));if(!list.length){toast("Nothing pending.");return;}
const tel0=list[0]?(phones[list[0].pic]||"").replace(/\D/g,""):"";dispatchOne(list[0].key);
for(const a of list.slice(1)){const tel=(phones[a.pic]||"").replace(/\D/g,"");const msg=`[CALIBER alarm] ${a.tag}: ${a.title} (${a.detail}). Please acknowledge and update the follow-up board.`;
sendlog.unshift({key:a.key,ts:"2026-08-19",to:a.pic+(tel?" ("+tel+")":""),ch:tel?"WhatsApp":"simulated",msg});}
saveAll();if(tel0)toast("First alarm opened in WhatsApp, rest logged.");else render();render();}
/* ---------- personnel (point 6) ---------- */
function vPersonnel(){const{E,open}=agg();const pics={};
for(const r of open){const k=r.pic||"-";pics[k]=pics[k]||{pic:k,n:0,od:0,loss:0};pics[k].n++;pics[k].loss+=(+r.total_loss||0)*1000;if(r.rca_due&&new Date(r.rca_due)<TODAY)pics[k].od++;}
const arr=Object.values(pics).sort((a,b)=>b.od-a.od||b.loss-a.loss);
for(const p of arr){const fl=follows.filter(f=>f.pic===p.pic);p.done=fl.filter(f=>f.status==="Done"||f.status==="Verified").length;p.ftot=fl.length;p.rate=p.ftot?Math.round(p.done/p.ftot*100):(p.n?0:100);}
return `<h1>Personnel Monitoring</h1><div class="sub">${arr.length} PICs carry open work · phone numbers enable one-click WhatsApp dispatch · completion from the Follow-up board.</div>
${arr.map(p=>`<div class="pcard"><div class="av">${esc(p.pic.slice(0,1))}</div>
<div style="flex:1;min-width:200px"><b class="mono">${esc(p.pic)}</b><div style="font-size:11px;color:var(--mut)">${p.n} open · <b style="color:${p.od?"var(--red)":"var(--green)"}">${p.od} overdue</b> · ${usd(p.loss)} exposure · follow-up done ${p.done}/${p.ftot} (${p.rate}%)</div>
<div class="prog"><i style="width:${p.rate}%"></i></div></div>
<div style="display:flex;gap:7px;align-items:center"><input type="tel" placeholder="+62…" value="${esc(phones[p.pic]||"")}" onchange="phones['${esc(p.pic)}']=this.value;saveAll();render();toast('Number saved for ${esc(p.pic)}.');"><button class="btn ghost" style="padding:7px 12px" onclick="testPing('${esc(p.pic)}')">Ping</button></div></div>`).join("")}`;}
function testPing(pic){const tel=(phones[pic]||"").replace(/\D/g,"");const msg="[CALIBER] Test ping — please confirm you receive PIC dispatches.";
if(tel){window.open("https://wa.me/"+tel+"?text="+encodeURIComponent(msg),"_blank");sendlog.unshift({key:"PING-"+Date.now(),ts:"2026-08-19",to:pic+" ("+tel+")",ch:"WhatsApp",msg});saveAll();toast("Test dispatch sent to "+pic+".");}
else toast("Save a phone number for "+pic+" first.");}
/* ---------- reports (point 3) ---------- */
const REPS=[["ops","Daily Operations Report","Plant performance summary"],["inc","Incident Summary Report","Trends by severity, status, mechanism"],["rca","RCA Analysis Report","Root causes + CAPA owners"],["fol","Follow-up Results Report","Outcomes of every tindak lanjut"],["per","Personnel Monitoring Report","Load, overdue, completion per PIC"],["nrg","Energy & Emission Report","Derived consumption + method"]];
function vReports(){return `<h1>Reports</h1><div class="sub">Generate and view operational reports · follow-up outcomes included · print-ready.</div>
<div class="card">${REPS.map(r=>`<div class="rep"><div class="doc">▤</div><div><div class="t">${r[1]}</div><div class="d">${r[2]}</div></div><button class="btn ghost" onclick="state.rep='${r[0]}';render()">Generate</button></div>`).join("")}</div>
<div id="repOut">${state.rep?repHtml(state.rep):""}</div>`;}
function repHtml(k){const{E,totLoss,open,od,closed,odLoss}=agg();const H=(t,inner)=>`<div class="card noprint-hide" style="margin-top:12px"><div class="btnrow noprint"><button class="btn" onclick="window.print()">🖨 Print / PDF</button><button class="btn ghost" onclick="state.rep=null;render()">Close</button></div><h2 style="font-size:16px;font-weight:800">${t}</h2><div class="sub">CALIBER 2026 · Case 2 · generated 19-Aug-2026 from live baseline${Object.keys(edits).length?` (${Object.keys(edits).length} local edit(s) included)`:""}</div>${inner}</div>`;
if(k==="ops")return H("Daily Operations Report",`<div class="row4"><div class="card kpi"><div class="lab">Incidents</div><div class="v">${E.length}</div></div><div class="card kpi"><div class="lab">Open</div><div class="v">${open.length}</div></div><div class="card kpi"><div class="lab">Overdue</div><div class="v" style="color:var(--red)">${od.length}</div></div><div class="card kpi"><div class="lab">Loss</div><div class="v" style="font-size:19px">${usd(totLoss)}</div></div></div>
<p style="font-size:12px">Top exposure overdue: ${od.map(r=>({...r,late:lateOf(r)||0})).map(r=>({...r,score:(+r.total_loss||0)*1000*r.late})).sort((a,b)=>b.score-a.score).slice(0,5).map(r=>`<b class="mono">${esc(r.tag)}</b> ${esc(String(r.title).slice(0,36))} (${r.late}d, ${usd((+r.total_loss||0)*1000)}, PIC ${esc(r.pic||"-")})`).join(" · ")}</p>`);
if(k==="inc"){const by={};E.forEach(r=>{const s=sevOf(r);by[s]=by[s]||{s,n:0,od:0,loss:0};by[s].n++;by[s].loss+=(+r.total_loss||0)*1000;if(OPEN.has(r.status)&&r.rca_due&&new Date(r.rca_due)<TODAY)by[s].od++;});
const me={};E.forEach(r=>{me[r.mech]=me[r.mech]||{k:r.mech,n:0,loss:0};me[r.mech].n++;me[r.mech].loss+=(+r.total_loss||0)*1000;});
const topM=Object.values(me).sort((a,b)=>b.loss-a.loss).slice(0,6);
return H("Incident Summary Report",`<table><thead><tr><th>Severity</th><th class="num">Count</th><th class="num">Overdue</th><th class="num">Loss</th></tr></thead><tbody>${Object.values(by).map(s=>`<tr><td><span class="pill ${pillS(s.s)}">${s.s}</span></td><td class="num">${s.n}</td><td class="num">${s.od}</td><td class="num">${usd(s.loss)}</td></tr>`).join("")}</tbody></table>
<p style="font-size:12px;margin-top:10px">Top mechanisms: ${topM.map(m=>`<b>${esc(m.k)}</b> ${m.n}× ${usd(m.loss)}`).join(" · ")}</p>`);}
if(k==="rca")return H("RCA Analysis Report",Object.keys(RCA).map(t=>{const d=RCA[t];const oc=(d.capa||[]).filter(c=>!String(c.status||"").toLowerCase().includes("closed")).length;
return `<p style="font-size:12px"><b class="mono">${esc(t)}</b> — <b>${esc(d.title)}</b> (${esc(d.ar)})<br>Root cause: ${esc(String(d.root_cause).slice(0,180))}…<br>CAPA: ${(d.capa||[]).length} actions, <b>${oc} open</b> · PIC ${esc(d.pic_rca)}</p>`;}).join("<hr style='border:0;border-top:1px solid var(--line);margin:8px 0'>"));
if(k==="fol"){const done=follows.filter(f=>f.status==="Done"||f.status==="Verified");
return H("Follow-up Results Report",`<p style="font-size:12px">Tracked <b>${follows.length}</b> · completed <b>${done.length}</b> · avg progress <b>${follows.length?Math.round(follows.reduce((a,f)=>a+(+f.prog||0),0)/follows.length):0}%</b> · overdue <b>${follows.filter(f=>f.status!=="Done"&&f.status!=="Verified"&&f.due&&new Date(f.due)<TODAY).length}</b></p>
<table><thead><tr><th>ID</th><th>Incident</th><th>Action + evidence</th><th>Owner</th><th>Status</th><th class="num">Progress</th></tr></thead><tbody>
${follows.map(f=>`<tr><td class="mono">${f.id}</td><td class="mono">INC-${String(f.serial).padStart(4,"0")}</td><td>${esc(f.action)}${f.note?`<div style="font-size:10.5px;color:var(--mut)">Evidence: ${esc(f.note)}</div>`:''}</td><td class="mono">${esc(f.pic)}</td><td><span class="pill ${f.status==="Done"||f.status==="Verified"?"p-g":f.status==="In Progress"?"p-b":"p-a"}">${esc(f.status)}</span></td><td class="num">${f.prog}%</td></tr>`).join("")||'<tr><td colspan="6">No follow-ups recorded yet.</td></tr>'}</tbody></table>`);}
if(k==="per"){const pics={};for(const r of open){const q=r.pic||"-";pics[q]=pics[q]||{pic:q,n:0,od:0,loss:0};pics[q].n++;pics[q].loss+=(+r.total_loss||0)*1000;if(r.rca_due&&new Date(r.rca_due)<TODAY)pics[q].od++;}
const arr=Object.values(pics).sort((a,b)=>b.od-a.od);
return H("Personnel Monitoring Report",`<table><thead><tr><th>PIC</th><th class="num">Open</th><th class="num">Overdue</th><th class="num">Exposure</th><th class="num">Follow-up done</th></tr></thead><tbody>
${arr.map(p=>{const fl=follows.filter(f=>f.pic===p.pic);const dn=fl.filter(f=>f.status==="Done"||f.status==="Verified").length;
return `<tr><td class="mono"><b>${esc(p.pic)}</b></td><td class="num">${p.n}</td><td class="num">${p.od}</td><td class="num">${usd(p.loss)}</td><td class="num">${dn}/${fl.length}</td></tr>`;}).join("")}</tbody></table>`);}
if(k==="nrg")return H("Energy & Emission Report",`<p style="font-size:12px">Derived energy <b>${META.kwh.toLocaleString("en-US")} kWh</b> over ${META.hours.toLocaleString("en-US")} operating hours · CO₂ <b>${META.co2} t</b> (Jamali factor 0.794). Method: P=√3×400×I×0.86/1000 over RUN_STATUS=ON. No energy tag exists in the baseline — proxy, never metered. Per asset: ${META.eKwh.map(e=>esc(e.tag)+" "+Math.round(e.kwh).toLocaleString("en-US")+" kWh").join(" · ")}</p>`);
return "";}
/* ---------- render ---------- */
function render(){tick();const{E,od}=agg();const openN=E.filter(r=>OPEN.has(r.status)).length;
document.getElementById("bellN").textContent=od.length;
document.getElementById("bdgAlm").textContent=alarms().length;
document.getElementById("bdgFol").textContent=follows.filter(f=>f.status!=="Done"&&f.status!=="Verified").length||"";
const V={overview:vOverview,assets:vAssets,assetdet:vAssetDet,incidents:vIncidents,incdet:vIncDet,condition:vCondition,production:vProduction,energy:vEnergy,rca:vRca,followup:vFollow,alarm:vAlarm,personnel:vPersonnel,reports:vReports};
document.querySelectorAll(".mi").forEach(b=>b.classList.toggle("on",b.dataset.v===state.v||(state.v==="assetdet"&&b.dataset.v==="assets")||(state.v==="incdet"&&b.dataset.v==="incidents")));
document.getElementById("views").innerHTML=`<div class="view on">${(V[state.v]||vOverview)()}</div>`;
window.scrollTo(0,0);}
function renderList(){}
render();
</script>
</body>
</html>
