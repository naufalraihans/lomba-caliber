<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>CALIBER - Intelligent Manufacturing Operations Center - Case 2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--sb:#0A2342;--bg:#F3F5F9;--card:#fff;--line:#E5E7EB;--ink:#111928;--mut:#6B7280;
--blue:#1A56DB;--sky:#3B82F6;--green:#16A34A;--amber:#D97706;--amberBg:#FEF3C7;--red:#DC2626;--redBg:#FEE2E2;--greenBg:#DCFCE7}
body{background:var(--bg);color:var(--ink);font:12.5px/1.5 "Plus Jakarta Sans",Inter,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:196px 1fr;min-height:100vh}
.sb{background:var(--sb);color:#C9D5E8;padding:16px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:9px;padding:2px 8px 4px;color:#fff;font-weight:800;font-size:11px;letter-spacing:.3px}
.logo i{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#53c3d9,#1A56DB);display:grid;place-items:center;font-style:normal;font-size:13px;color:#fff;flex:none}
.logo small{display:block;font-size:9px;color:#7E8FAD;font-weight:600;letter-spacing:.4px}
.mi{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:12px;font-weight:600;color:#C9D5E8;cursor:pointer;border:0;background:none;width:100%;text-align:left;font-family:inherit}
.mi .ic{width:18px;text-align:center;font-size:14px}
.mi:hover{background:rgba(255,255,255,.08);color:#fff}
.mi.on{background:#fff;color:#0A2342;font-weight:700}
.mi .bdg{margin-left:auto;background:#DC2626;color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 7px}
.sbsep{border-top:1px solid rgba(255,255,255,.12);margin:10px 4px}
.sbh{font-size:10px;letter-spacing:1px;color:#7E8FAD;padding:6px 12px 2px;font-weight:700}
.main{min-width:0;padding:0 20px 46px}
.top{position:sticky;top:0;z-index:20;background:rgba(243,245,249,.92);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:12px 0}
.search{flex:1;max-width:460px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 14px;color:var(--mut);font-size:12px;font-family:inherit}
.top .dt{margin-left:auto;font-size:11.5px;color:var(--mut);font-weight:600;white-space:nowrap}
.bell{width:32px;height:32px;border-radius:9px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;position:relative;font-size:15px}
.bell i{position:absolute;top:-6px;right:-6px;background:#DC2626;color:#fff;font-size:9.5px;font-weight:800;border-radius:999px;padding:1px 6px;font-style:normal}
.adm{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:4px 10px 4px 4px;font-size:12px;font-weight:700}
.adm i{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px}
.view{display:none}.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:19px;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:12px;margin:2px 0 14px}
.row5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.row2{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 2px rgb(16 24 40/.05);min-width:0}
.card h3{font-size:13.5px;font-weight:700;margin-bottom:2px}
.card .cap{font-size:11px;color:var(--mut);margin-bottom:12px}
.kpi .lab{font-size:10.5px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.kpi .v{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:4px 0 0;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;font-weight:700;color:var(--mut)}
.kpi .s{font-size:11px;font-weight:600}
.g{color:var(--green)}.r{color:var(--red)}.a{color:var(--amber)}.b{color:var(--sky)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:10.5px;font-weight:700;white-space:nowrap}
.p-g{background:var(--greenBg);color:var(--green)}.p-a{background:var(--amberBg);color:var(--amber)}.p-r{background:var(--redBg);color:var(--red)}.p-b{background:#DBEAFE;color:var(--blue)}.p-n{background:#F1F5F9;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);padding:7px 8px;border-bottom:1px solid var(--line);font-weight:700}
td{padding:8px;border-bottom:1px solid #F1F5F9;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#F8FAFF}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:9px 16px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--red)}
.btnrow{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.fpill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink)}
.fpill.on{background:#0A2342;color:#fff;border-color:#0A2342}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;background:#fff}
.alert .t{font-size:12px;font-weight:700}
.alert .d{font-size:11px;color:var(--mut)}
.alert .when{margin-left:auto;font-size:10.5px;font-weight:700;white-space:nowrap}
.grid-assets{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.acard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center}
.acard .aid{font-weight:800;font-size:13px}
.acard .anm{font-size:11px;color:var(--mut);margin-bottom:8px;min-height:30px}
.ring{position:relative;width:104px;height:104px;margin:0 auto 8px}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:17px}
.link{color:var(--blue);font-size:11.5px;font-weight:700;cursor:pointer;background:none;border:0;font-family:inherit;padding:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;font-family:inherit;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:7px 18px;font-size:11.5px}
.spec .k{color:var(--mut)}
.minis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.mini{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mini .l{font-size:10.5px;color:var(--mut);font-weight:600}
.mini .vv{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 14px}
.tl .ev:before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--sky);border:2px solid #fff;box-shadow:0 0 0 2px var(--sky)}
.tl .ev.done:before{background:var(--green);box-shadow:0 0 0 2px var(--green)}
.tl .ev .tt{font-size:11.5px;font-weight:700}
.tl .ev .dd{font-size:11px;color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:14px;min-height:170px;padding:10px 6px 0}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bar i{width:70%;border-radius:5px 5px 0 0;display:block}
.bar span{font-size:10px;color:var(--mut);font-weight:600}
.rep{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #F1F5F9}
.rep:last-child{border-bottom:0}
.rep .doc{width:34px;height:34px;border-radius:9px;background:#DBEAFE;color:var(--blue);display:grid;place-items:center;font-size:16px;flex:none}
.rep .t{font-size:12.5px;font-weight:700}
.rep .d{font-size:11px;color:var(--mut)}
.rep .btn{margin-left:auto}
.fld{margin-bottom:12px}.fld label{font-size:11.5px;font-weight:700;display:block;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-family:inherit;font-size:12.5px;background:#fff;color:var(--ink)}
.fld textarea{min-height:74px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:11.5px;color:var(--mut)}
.pager button{border:1px solid var(--line);background:#fff;border-radius:7px;min-width:28px;height:28px;cursor:pointer;font-family:inherit;font-size:11.5px}
.pager button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.note{background:#EFF6FF;border:1px solid #BFDBFE;border-radius:10px;padding:10px 13px;font-size:11.5px;color:#1E40AF;margin-top:12px}
.note.warn{background:#FFFBEB;border-color:#FDE68A;color:#92400E}
.prog{height:7px;background:#EDF1F7;border-radius:4px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;border-radius:4px;background:var(--sky)}
input[type=range]{width:130px;accent-color:var(--blue)}
select.mini-sel{border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-family:inherit;font-size:11px;background:#fff}
#modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(10,35,66,.5);z-index:50;padding:18px}
#modal.on{display:grid}
.mbox{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:22px}
.mbox h2{font-size:16px;font-weight:800;margin-bottom:2px}
.mbox .msub{font-size:11.5px;color:var(--mut);margin-bottom:14px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:99}
.tst{background:#0A2342;color:#fff;border-radius:10px;padding:10px 18px;font-size:12px;font-weight:600;box-shadow:0 10px 30px -8px rgb(0 0 0/.4)}
.pcard{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;background:#fff}
.pcard .av{width:38px;height:38px;border-radius:50%;background:#DBEAFE;color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.pcard input[type=tel]{border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-family:inherit;font-size:11.5px;width:150px}
.log{font-size:11px;border:1px solid var(--line);border-radius:9px;padding:8px 11px;margin-bottom:7px;background:#F8FAFF}
@media print{.sb,.top,#toast,#modal,.noprint,.mnav,.mhead{display:none!important}.app{display:block}.main{padding:0}}
/* ---------- responsive: tablet ---------- */
@media(max-width:1100px){.row5,.row4{grid-template-columns:1fr 1fr}.row3,.row2,.grid-assets,.minis{grid-template-columns:1fr}.f2{grid-template-columns:1fr}}
/* ---------- responsive: phone ---------- */
.mnav,.mhead{display:none}
.ic{display:inline-flex;flex:none;width:18px;height:18px;align-items:center;justify-content:center}
.ic svg,.btn svg{width:14px;height:14px;display:block}
.mi .ic{width:18px}.mi .ic svg{width:17px;height:17px}
.btn svg{vertical-align:-2px}
.iced svg{width:11px;height:11px;vertical-align:-1px}
.logo-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#03BED7,#192F7B);display:grid;place-items:center;flex:none}
.logo-mark svg{width:19px;height:19px}
.logo-img{height:30px;background:#fff;border-radius:8px;padding:3px 10px;flex:none}
.mhead .logo-img{height:24px}
.clickable{cursor:pointer;transition:transform .12s,box-shadow .12s}
.clickable:hover{transform:translateY(-2px);box-shadow:0 6px 18px -8px rgb(10 35 66/.25)}
.src{font-size:10px;color:var(--mut);margin-top:8px}
.aimg{display:flex;justify-content:center;margin-bottom:8px}
.aimg svg{width:128px;height:78px}
.pipe{display:flex;margin-bottom:12px;flex-wrap:wrap}
.pstep{flex:1;min-width:140px;background:#fff;border:1px solid var(--line);padding:12px 14px}
.pstep:first-child{border-radius:12px 0 0 12px}.pstep:last-child{border-radius:0 12px 12px 0}
.pstep .n{font-size:20px;font-weight:800}
.pstep .t{font-size:11.5px;font-weight:700}.pstep .d{font-size:10.5px;color:var(--mut)}
.emptyart{display:flex;gap:14px;align-items:center;padding:18px;background:#F8FAFF;border:1px dashed var(--line);border-radius:12px;margin-bottom:12px}
.emptyart p{font-size:12px}
.pmap{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.ublock{background:#F8FAFF;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:center;font-family:inherit;width:100%}
.ublock:hover{border-color:var(--blue)}
.ublock .un{font-weight:800;font-size:12.5px}
.cctv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cam{background:#0A2342;color:#fff;border-radius:10px;padding:10px;font-size:10.5px;position:relative;overflow:hidden;cursor:pointer;text-align:left;font-family:inherit;border:0;width:100%}
.cam .live{position:absolute;top:8px;left:8px;background:#DC2626;border-radius:6px;font-size:9px;font-weight:800;padding:2px 7px}
.cam .tag{font-weight:800;font-size:11px;margin-top:18px}
.cam .ti{opacity:.75;font-size:10px}
.cam .scan{height:3px;background:linear-gradient(90deg,transparent,#53c3d9,transparent);margin-top:8px;animation:scan 2.4s linear infinite}
.duty{background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit}
.lobby-hero{background:linear-gradient(135deg,#0A2342,#1A56DB);color:#fff;border-radius:18px;padding:34px 30px;margin:16px 0 14px}
.lobby-hero h1{font-size:clamp(24px,4vw,38px);letter-spacing:-.02em;color:#fff}
.lobby-hero p{color:#C9D5E8;max-width:660px;margin:8px 0 18px}
.feat6{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.feat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;text-align:left;font-family:inherit}
.feat b{font-size:12.5px}.feat p{font-size:11px;color:var(--mut);margin-top:4px}
@media(max-width:860px){
.app{grid-template-columns:1fr}
.sb{display:none}
.mhead{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;background:var(--sb);color:#fff;padding:10px 14px}
.mhead .logo{padding:0}
.mhead b{font-size:13px}
#burger{margin-left:auto;background:rgba(255,255,255,.12);border:0;color:#fff;font-size:18px;border-radius:9px;width:38px;height:38px;cursor:pointer}
.mnav{display:none;background:var(--sb);padding:6px 12px 14px;position:sticky;top:58px;z-index:39}
.mnav.on{display:block}
.mnav .mi{font-size:13px;padding:11px 12px}
.main{padding:0 12px 40px}
.top{flex-wrap:wrap;gap:8px}
.search{max-width:none;flex:1 1 100%;order:3}
.top .dt{font-size:10.5px}
h1{font-size:17px}
.row5,.row4{grid-template-columns:1fr 1fr;gap:10px}
.row3,.row2,.grid-assets,.minis,.f2{grid-template-columns:1fr}
.card{padding:13px}
.kpi .v{font-size:20px}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -13px;padding:0 13px}
.tscroll table{min-width:640px}
.alert{flex-wrap:wrap}
.alert .when{margin-left:0}
.pcard{flex-wrap:wrap}
.spec{grid-template-columns:1fr}
.tabs{overflow-x:auto;flex-wrap:nowrap}
.tabs button{white-space:nowrap}
.mbox{padding:18px 15px}
#modal{padding:10px}
.bars{gap:8px}
input[type=range]{width:100px}
}
/* ---------- rev16: glanceable monitoring ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(400%)}}
.view.on>*{animation:rise .35s ease backwards}
.view.on>*:nth-child(2){animation-delay:.05s}.view.on>*:nth-child(3){animation-delay:.1s}.view.on>*:nth-child(4){animation-delay:.15s}
.hero-grid{display:grid;grid-template-columns:300px 1fr;gap:12px;margin-bottom:14px}
@media(max-width:1100px){.hero-grid{grid-template-columns:1fr}}
.hero-card{background:linear-gradient(135deg,#0A2342,#1A56DB);color:#fff;border-radius:14px;padding:18px;text-align:center;position:relative;overflow:hidden}
.hero-card .lab{font-size:11px;letter-spacing:1px;color:#9FB3D1;font-weight:700}
.hero-card .big{font-size:44px;font-weight:800;letter-spacing:-.02em}
.hero-card .delta{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;padding:2px 10px;border-radius:999px}
.pills3{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.pills3 span{font-size:11px;font-weight:700;padding:3px 12px;border-radius:999px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:1100px){.kpi-grid{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.kpi-grid{grid-template-columns:1fr}}
.kpi-mini{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font-family:inherit;width:100%;transition:transform .12s,box-shadow .12s;color:var(--ink)}
.kpi-mini:hover{transform:translateY(-2px);box-shadow:0 6px 18px -8px rgb(10 35 66/.25)}
.kpi-mini .t{font-size:10.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.kpi-mini .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi-mini .s{font-size:10.5px;color:var(--mut)}
.kpi-mini .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rankrow{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid #F1F5F9;cursor:pointer;border:0;background:none;width:100%;text-align:left;font-family:inherit;font-size:11.5px;color:var(--ink)}
.rankrow:last-child{border-bottom:0}
.rankno{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:11px;flex:none;color:#fff;background:#64748B}
.rankbar{height:10px;border-radius:5px;background:#16A34A;min-width:8px;animation:grow .5s ease;transform-origin:left}
.lossrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 4px;cursor:pointer;border:0;background:none;width:100%;text-align:left;font-family:inherit;color:var(--ink);font-size:11.5px}
.lossbar{grid-column:1/-1;height:9px;background:#F1F5F9;border-radius:5px;overflow:hidden}
.lossbar i{display:block;height:100%;background:#DC2626;border-radius:5px;animation:grow .5s ease;transform-origin:left}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:var(--mut);margin-bottom:10px;align-items:center}
.srcbtn{font-size:10px;color:var(--mut);margin-top:8px;background:none;border:0;cursor:pointer;font-family:inherit;padding:0;text-decoration:underline dotted}
.live-dot{width:8px;height:8px;border-radius:50%;background:#22C55E;display:inline-block;animation:pulse-dot 1.6s infinite}
.camscene{border-radius:8px;overflow:hidden;margin-top:20px}
.cam.big{padding:0}
.cam .cap2{padding:8px 10px}
.howto{background:#F8FAFF;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:11px;color:var(--mut);margin-bottom:12px}
.charts2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:1100px){.charts2{grid-template-columns:1fr}}

.bar i{transform-origin:bottom;animation:growY .5s ease}
.hero3{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
.hero3 .hs{background:rgba(255,255,255,.12);border-radius:10px;padding:8px 16px;min-width:130px}
.hero3 .hs b{display:block;font-size:20px}
.hero3 .hs span{font-size:10.5px;color:#C9D5E8}
.logwrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.loghead{padding:16px 16px 12px}
.loghead h2{font-size:15px;font-weight:800;letter-spacing:-.01em}
.loghead .sub{color:var(--mut);font-size:11.5px;margin-top:2px}
.logfilt{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 12px;align-items:center}
.logfilt select,.logfilt input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-family:inherit;font-size:11.5px;background:#fff;color:var(--ink)}
.logtable{width:100%;border-collapse:collapse;font-size:11.5px;min-width:1180px}
.logtable th{position:sticky;top:0;background:#F8FAFF;z-index:2;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);padding:9px 10px;border-bottom:1px solid var(--line);border-top:1px solid var(--line);text-align:left;font-weight:700;white-space:nowrap}
.logtable td{padding:9px 10px;border-bottom:1px solid #F1F5F9;vertical-align:top}
.logtable tbody tr{cursor:pointer}
.logtable tbody tr:hover td{background:#F8FAFF}
tr.logcrit td:first-child{border-left:3px solid #DC2626}
tr.logwarn td:first-child{border-left:3px solid #D97706}
tr.logok td:first-child{border-left:3px solid #16A34A}
.dur-short{color:#D97706;font-weight:800;white-space:nowrap}
.dur-long{color:#DC2626;font-weight:800;white-space:nowrap}
.causecat{color:#1D4ED8;font-weight:700}
.causedet{color:var(--mut);font-size:10.5px;max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;white-space:nowrap}
.st .dt{width:8px;height:8px;border-radius:50%;flex:none}
.st-red{color:#DC2626}.st-red .dt{background:#DC2626}
.st-pur{color:#7C3AED}.st-pur .dt{background:#7C3AED}
.st-grn{color:#16A34A}.st-grn .dt{background:#16A34A}
.cmdpill{display:inline-block;font-size:9.5px;font-weight:800;border-radius:6px;padding:1px 7px;margin-top:4px;color:#fff}
.cmd1{background:#059669}.cmd2{background:#B45309}
.evthumb{width:40px;height:30px;border-radius:6px;object-fit:cover;border:1px solid var(--line)}
.evbox{display:inline-flex;width:40px;height:30px;border-radius:6px;align-items:center;justify-content:center;border:1px dashed var(--line);background:#F8FAFF}
.logpg{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:12px 16px;font-size:11.5px;color:var(--mut);flex-wrap:wrap}
.logpg button{border:1px solid var(--line);background:#fff;border-radius:7px;min-width:28px;height:28px;cursor:pointer;font-family:inherit;font-size:11.5px}
.logpg button.on{background:#0A2342;color:#fff;border-color:#0A2342}

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const usd=v=>{v=+v;if(Math.abs(v)>=1e6)return"US$"+(v/1e6).toFixed(2)+"M";if(Math.abs(v)>=1e3)return"US$"+(v/1e3).toFixed(0)+"K";return"US$"+Math.round(v);};
const fD=s=>{if(!s)return"-";const p=String(s).slice(0,10).split("-");const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return p.length===3?+p[2]+" "+M[+p[1]-1]+" "+p[0]:s;};

const stOf=r=>OPEN.has(r.status)?(r.rca_due&&new Date(r.rca_due)<TODAY?"Overdue":"Open"):"Closed";
const pillS=s=>s==="Critical"?"p-r":s==="Warning"?"p-a":"p-b";
const pillT=s=>s==="Closed"?"p-g":s==="Overdue"?"p-r":"p-b";

const eff=()=>INC.map(r=>edits[r.serial]?Object.assign({},r,edits[r.serial]):r);
function line(pts,color,h,opts){
const w=560,H=h||150,p=8,o=opts||{};
const f=pts.filter(v=>v!=null&&isFinite(v));if(f.length<2)return '';
const lo=Math.min.apply(null,f),hi=Math.max.apply(null,f),rg=(hi-lo)||1;
const X=i=>p+(i/(pts.length-1))*(w-2*p);
const Y=v=>p+(1-(v-lo)/rg)*(H-2*p);
const Q=String.fromCharCode(34);
const d=pts.map((v,i)=>((i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1))).join(' ');
const l=pts.length-1;
let g='<path d='+Q+d+' L'+X(l).toFixed(1)+' '+(H-p)+' L'+p+' '+(H-p)+' Z'+Q+' fill='+Q+color+Q+' opacity='+Q+'0.10'+Q+'/>';
g+='<path d='+Q+d+Q+' fill='+Q+'none'+Q+' stroke='+Q+color+Q+' stroke-width='+Q+'2'+Q+'/>';
g+='<circle cx='+Q+X(l).toFixed(1)+Q+' cy='+Q+Y(pts[l]).toFixed(1)+Q+' r='+Q+'3.5'+Q+' fill='+Q+color+Q+'/>';
if(o.band){const xi=o.band.map(i=>X(i));const x1=Math.min.apply(null,xi),x2=Math.max.apply(null,xi);g+='<rect x='+Q+x1.toFixed(1)+Q+' y='+Q+p+Q+' width='+Q+Math.max(2,x2-x1).toFixed(1)+Q+' height='+Q+(H-2*p)+Q+' fill='+Q+'#D97706'+Q+' opacity='+Q+'0.14'+Q+'/>';}
if(o.thr!=null){const y=Y(o.thr);g+='<line x1='+Q+p+Q+' y1='+Q+y.toFixed(1)+Q+' x2='+Q+(w-p)+Q+' y2='+Q+y.toFixed(1)+Q+' stroke='+Q+'#DC2626'+Q+' stroke-width='+Q+'1.3'+Q+' stroke-dasharray='+Q+'5 3'+Q+'/>';}
if(o.alarm!=null){const y=Y(o.alarm);g+='<line x1='+Q+p+Q+' y1='+Q+y.toFixed(1)+Q+' x2='+Q+(w-p)+Q+' y2='+Q+y.toFixed(1)+Q+' stroke='+Q+'#D97706'+Q+' stroke-width='+Q+'1.3'+Q+' stroke-dasharray='+Q+'5 3'+Q+'/>';}
return '<svg viewBox='+Q+'0 0 '+w+' '+H+Q+' style='+Q+'width:100%;display:block'+Q+'>'+g+'</svg>';}
function thrOf(tag,pname){const L=(META.limits||{})[tag]||{};const ks=Object.keys(L);let hit='';const base=pname.split(' (')[0];for(const k of ks){const kb=k.split(' (')[0];if(pname.indexOf(kb)===0||k.indexOf(base)===0){hit=k;break;}}if(!hit)return{};const vv=String(L[hit]);const mm=vv.match(/[0-9]+(\.[0-9]+)?/g)||[];return{alarm:parseFloat(mm[0]),trip:parseFloat(mm[1])};}
function statOf(series){const s=series.filter(v=>isFinite(v));const last=s[s.length-1];let mn=s[0],mx=s[0],sm=0;for(const v of s){if(v<mn)mn=v;if(v>mx)mx=v;sm+=v;}return{last:last,mn:mn,mx:mx,avg:sm/(s.length||1)};}
function ring(pct,color){const C=2*Math.PI*44;return `<div class="ring"><svg width="104" height="104"><circle cx="52" cy="52" r="44" fill="none" stroke="#EDF1F7" stroke-width="11"/><circle cx="52" cy="52" r="44" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${(pct/100*C).toFixed(1)} ${C.toFixed(1)}"/></svg><div class="pct">${pct}%</div></div>`;}
function modal(h){const m=document.getElementById("modal");m.innerHTML=`<div class="mbox">${h}</div>`;m.classList.add("on");m.onclick=e=>{if(e.target.id==="modal")closeModal();};}
function closeModal(){const m=document.getElementById("modal");m.classList.remove("on");m.innerHTML="";}
function toast(t){const d=document.createElement("div");d.className="tst";d.textContent=t;document.getElementById("toast").appendChild(d);setTimeout(()=>d.remove(),3200);}

function agg(){const E=eff();const totLoss=E.reduce((a,r)=>a+(+r.total_loss||0)*1000,0);const open=E.filter(r=>OPEN.has(r.status));const od=open.filter(r=>r.rca_due&&new Date(r.rca_due)<TODAY);return{E,totLoss,open,od,closed:E.length-open.length,odLoss:od.reduce((a,r)=>a+(+r.total_loss||0)*1000,0)};}
function alarms(){const{E,od}=agg();const list=EQC.filter(a=>a.lead>=42).map(a=>({kind:"asset",key:"A-"+a.tag,tag:a.tag,title:a.name+" - "+a.mode,sev:a.lead>=70?"Critical":"Warning",pic:(RCA[a.tag]&&RCA[a.tag].pic_rca)||(E.find(r=>r.tag===a.tag)||{}).pic||"-",detail:a.alarm+" alarm-weeks - "+a.lead+"d lead"}));
od.filter(r=>sevOf(r)==="Critical").slice(0,12).forEach(r=>list.push({kind:"inc",key:"I-"+r.serial,serial:r.serial,tag:r.tag,title:String(r.title).slice(0,52),sev:"Critical",pic:r.pic||"-",detail:(lateOf(r)||0)+"d late - "+usd((+r.total_loss||0)*1000)}));return list;}
function srcBtn(src){return `<button class="srcbtn" onclick="event.stopPropagation();srcPop('${esc(src)}')">Source: ${esc(src)} - tap for detail</button>`;}
function srcPop(src){const map={"Incident DB":["Every incident row: date, tag, severity, status, downtime, loss, PIC, due date. Overdue = open + past due.","Open: Incidents (table below) - also Reports > Incident Summary."],"Equipment Performance":["Weekly readings per asset (26 weeks) + alarm/trip limits from Monitored Parameters & Limits.","Open: Assets - pick a tag - Overview / Live Data tabs."],"Condition History":["26 weekly readings per parameter. Amber band = weeks flagged ALARM, red dashed = trip, orange dashed = alarm.","Open: Condition - pick asset + parameter tab."],"Production PI":["Hourly FEED / VIB / TEMP / AMP + RUN_STATUS per asset, last 24 h shape.","Open: Production."],"Energy estimate":["Derived proxy only: P = sqrt(3) x 400 x I x 0.86 / 1000 over RUN_STATUS = ON. Never metered.","Open: Energy > Method card."]};
let hit=null;for(const k in map){if(src.indexOf(k)===0||k.indexOf(src.split(" ")[0])===0){hit=map[k];break;}}
modal(`<h2>Data source</h2><div class="msub">${esc(src)}</div><p style="font-size:12.5px">${esc((hit||["Figure computed live from the baseline. Open the linked view to verify row by row.",null])[0])}</p>${hit&&hit[1]?`<div class="note" style="margin-top:10px">${esc(hit[1])}</div>`:""}<div class="btnrow" style="margin-top:14px"><button class="btn" onclick="closeModal()">Got it</button></div>`);}

function spark(pts,color){const w=96,h=30,p=3;const f=pts.filter(v=>v!=null&&isFinite(v));if(f.length<2)return "";const lo=Math.min.apply(null,f),hi=Math.max.apply(null,f),rg=(hi-lo)||1;const X=i=>p+(i/(pts.length-1))*(w-2*p);const Y=v=>p+(1-(v-lo)/rg)*(h-2*p);const Q=String.fromCharCode(34);const d=pts.map((v,i)=>((i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1))).join(" ");const l=pts.length-1;return "<svg viewBox="+Q+"0 0 "+w+" "+h+Q+" style="+Q+"width:96px;height:30px;flex:none"+Q+"><path d="+Q+d+Q+" fill="+Q+"none"+Q+" stroke="+Q+color+Q+" stroke-width="+Q+"1.8"+Q+"/><circle cx="+Q+X(l).toFixed(1)+Q+" cy="+Q+Y(pts[l]).toFixed(1)+Q+" r="+Q+"2.6"+Q+" fill="+Q+color+Q+"/></svg>";}

function hbar(label,val,mx,color,onclick){const w=mx?Math.max(6,Math.round(val/mx*100)):0;return `<button class="rankrow" onclick="${onclick}" title="Open detail"><span class="rankno" style="background:${color}">${esc(label.slice(0,1))}</span><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(label)}</b><b class="mono">${val}</b></div><div class="rankbar" style="width:${w}%;background:${color};margin-top:4px"></div></div></button>`;}

function lgCause(r){const m=String(r.mech||"");if(/leak/i.test(m))return{cat:"Leakage / component",det:String(r.component||"")+": "+String(r.title||"")};if(/vibr/i.test(m))return{cat:"High vibration",det:String(r.component||"")+": "+String(r.title||"")};if(/worn/i.test(m))return{cat:"Worn out / aging",det:String(r.component||"")+": "+String(r.title||"")};if(/crack/i.test(m))return{cat:"Crack / fracture",det:String(r.component||"")+": "+String(r.title||"")};if(/foul/i.test(m))return{cat:"Fouling / deposit",det:String(r.component||"")+": "+String(r.title||"")};if(/error|malfunc|loose|stuck|break|overheat|low|motor|mech|high/i.test(m))return{cat:m,det:String(r.component||"")+": "+String(r.title||"")};return{cat:m||"Recorded",det:String(r.component||"")+": "+String(r.title||"")};}
function lgTrip(r){const hrs=+r.downtime||0;if(hrs<=0)return{start:String(r.date).slice(0,10),end:"-",mins:0,txt:"-",cls:"dur-short"};const d0=new Date(String(r.date).slice(0,10)+"T00:00:00");const d1=new Date(d0.getTime()+hrs*3600e3);const mins=Math.round(hrs*60);const h=Math.floor(mins/60),mm=mins%60;const txt=h?h+" h "+mm+" min":mm+" min";return{start:fD(r.date),end:fD(d1.getFullYear()+"-"+String(d1.getMonth()+1).padStart(2,"0")+"-"+String(d1.getDate()).padStart(2,"0")),mins,txt,cls:hrs>=1?"dur-long":"dur-short"};}

const LOWBAD=["Seal Flush Flow","Discharge Pressure","Lube Oil Supply","Heat Duty"];
function paramState(pname,last,th){if(th==null||th.alarm==null||!isFinite(last))return{st:"Normal",col:"#16A34A"};
const low=LOWBAD.some(k=>pname.indexOf(k)===0);
if(low){if(th.trip!=null&&last<th.trip)return{st:"Past trip",col:"#DC2626"};if(last<th.alarm)return{st:"Past alarm",col:"#D97706"};return{st:"Normal",col:"#16A34A"};}

function assetVerdict(a){let crit=[],warn=[],ok=0;
a.params.forEach(p=>{const s=p.series.filter(v=>isFinite(v));if(!s.length)return;const last=s[s.length-1];const th=thrOf(a.tag,p.n);const r=paramState(p.n,last,th);
if(r.st==="Past trip")crit.push(p.n.split(" (")[0]);else if(r.st==="Past alarm")warn.push(p.n.split(" (")[0]);else ok++;});
let score=96-crit.length*30-warn.length*12;if(a.status==="Critical")score-=8;else if(a.status==="Warning")score-=4;
score=Math.max(5,Math.min(98,score));
const label=crit.length?"Needs work now":warn.length?"Watch closely":a.status==="Critical"?"Needs work now":a.status==="Warning"?"Watch closely":"Healthy - running fine";
const col=crit.length||a.status==="Critical"?"#DC2626":warn.length||a.status==="Warning"?"#D97706":"#16A34A";
return{score,label,col,crit,warn,ok,total:a.params.length};}
